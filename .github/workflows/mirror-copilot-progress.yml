name: Mirror Copilot progress to issue

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  mirror:
    if: github.event.pull_request.user.login == 'copilot-swe-agent[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Update originating issue
        uses: actions/github-script@v9
        with:
          retries: 2
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const action = context.payload.action;

            const data = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      nodes { number }
                    }
                  }
                }
              }`,
              { owner, repo, number: pr.number }
            );

            const issueNumbers = data.repository.pullRequest.closingIssuesReferences.nodes
              .map(node => node.number);

            if (issueNumbers.length === 0) {
              core.info('No closing issue reference found; nothing to mirror.');
              return;
            }

            const marker = `<!-- copilot-progress:pr-${pr.number} -->`;
            const shortSha = pr.head.sha.slice(0, 7);

            let status;
            if (action === 'closed') {
              status = pr.merged
                ? `Copilot PR #${pr.number} was merged.`
                : `Copilot PR #${pr.number} was closed without merging.`;
            } else if (action === 'ready_for_review') {
              status = `Copilot marked PR #${pr.number} ready for review.`;
            } else if (action === 'synchronize') {
              status = `Copilot pushed more work to PR #${pr.number} (latest \`${shortSha}\`).`;
            } else if (pr.draft) {
              status = `Copilot is working in draft PR #${pr.number}.`;
            } else {
              status = `Copilot is working in PR #${pr.number}.`;
            }

            const body = [
              marker,
              '### Copilot progress',
              status,
              '',
              `[${pr.title}](${pr.html_url})`,
              '',
              `Last update: ${new Date().toISOString()}`,
            ].join('\n');

            for (const issueNumber of issueNumbers) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: issueNumber, per_page: 100 }
              );

              const existing = comments.find(
                comment =>
                  comment.user?.login === 'github-actions[bot]' &&
                  comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            }
